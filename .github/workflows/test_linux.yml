name: Build and Test (Linux x86)

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch: # Manual execution

jobs:
  tests:
    name: Build and Test (Linux x86, ${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: default backend
            bazel-target: "test //score/... "
            upload-name: "score_crypto test results"
          - backend: pkcs11 provider
            bazel-target: "test //score/... --//score/crypto/src/backend:score_crypto_score_backend_enabled=False --//score/crypto/src/backend:score_crypto_score_openssl_enabled=False"
            upload-name: "score_crypto PKCS11 backend test results"
          - backend: openssl provider
            bazel-target: "test //score/... --//score/crypto/src/backend:score_crypto_pkcs11_backend_enabled=False"
            upload-name: "score_crypto OpenSSL backend test results"
    uses: eclipse-score/cicd-workflows/.github/workflows/tests.yml@7b1b65cbb59d5f817e639a731f018db5adb3028a
    with:
      bazel-target: ${{ matrix.bazel-target }}
      upload-name: ${{ matrix.upload-name }}
