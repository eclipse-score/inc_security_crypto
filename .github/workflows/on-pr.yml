name: PR Checks
permissions:
  contents: read
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
jobs:
  common:
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@on-pr/v0.0.0
    with:
      # TODO: For now, our clang-tidy execution is not clean
      # Skip pre-commit checks, reactivate after fixing all clang-tidy issues
      skip-pre-commit: true
      skip-bzlmod-lock: ${{ startsWith(github.head_ref, 'dependabot/') }}
