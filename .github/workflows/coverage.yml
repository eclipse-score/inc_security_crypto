name: Coverage
permissions:
  contents: read
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0

      - name: Check coverage scope completeness
        run: ./.github/tools/check_coverage_scope.sh

      - name: Run tests with LLVM coverage (C++ + Rust, line + branch)
        run: |
          set -euo pipefail
          # integration_test_docker is excluded: it executes the (coverage-
          # instrumented) binaries inside a stock ubuntu container where the
          # instrumentation runtime deps are absent (exit 127), and profiles
          # written inside the container never reach the host anyway. It keeps
          # running in the regular test job.
          bazel coverage --config=llvm_cov --build_tests_only -- //score/... \
          -//score/tests/integration_tests:integration_test_docker

      - name: Generate coverage report
        env:
          # Report-only at introduction; ratchet once a baseline is agreed.
          COVERAGE_THRESHOLD: "0"
        run: |
          set -euo pipefail
          bazel run @score_tooling//coverage:generate_coverage_html -- \
            --yaml tools/coverage/coverage_justifications.yaml \
            --testlogs-subdir score \
            --archive-dir coverage_artifact

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage_artifact/
